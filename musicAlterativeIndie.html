<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concerts — Indie — Frank Li</title>
  <meta name="description" content="Concerts — Indie — photography by Runcheng (Frank) Li. Alternative and indie sets up close." />
  <link rel="icon" href="images/favicons/camera.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/frank-redesign.css" />
  <style>
    .gal-hero { padding-top: 9rem; padding-bottom: 1rem; }
    .gal-hero__eyebrow { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1.1rem; display: flex; align-items: center; gap: 0.75rem; }
    .gal-hero__eyebrow::before { content: ''; display: block; width: 2rem; height: 1px; background: var(--accent); }
    .gal-hero h1 { font-size: clamp(2.6rem, 6.5vw, 4.8rem); letter-spacing: -0.03em; line-height: 1.03; margin-bottom: 1.1rem; }
    .gal-hero__sub { max-width: 620px; color: var(--text-muted); font-size: 1.04rem; margin-bottom: 1.75rem; }
    .gal-hero__meta { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .gal-count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim);
      border: 1px solid var(--border); padding: 0.3rem 0.85rem; border-radius: 100px; }
    .gal-back { font-size: 0.85rem; color: var(--text-muted); }
    .gal-back:hover { color: var(--accent); }
    .gal-section { padding: 2.5rem 0 1rem; }
    .adv-grid { columns: 3; column-gap: 0.75rem; }
    .adv-grid a { display: block; break-inside: avoid; margin-bottom: 0.75rem; border-radius: var(--radius);
      overflow: hidden; background: var(--surface-2); position: relative; cursor: zoom-in; }
    .adv-grid img { width: 100%; transition: transform 0.45s ease, opacity 0.45s ease; opacity: 0.92; }
    .adv-grid a:hover img { transform: scale(1.035); opacity: 1; }
    .lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(4,6,8,0.96); display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
    .lightbox__btn { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background var(--transition); backdrop-filter: blur(6px); }
    .lightbox__btn:hover { background: rgba(92,225,230,0.25); }
    .lightbox__prev { left: 1.25rem; } .lightbox__next { right: 1.25rem; }
    .lightbox__close { top: 1.25rem; right: 1.25rem; transform: none; }
    .lightbox__cap { position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%); text-align: center;
      max-width: 90vw; font-size: 0.9rem; color: rgba(255,255,255,0.92); }
    .lightbox__cap small { display: block; font-family: var(--font-mono); font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 0.25rem; letter-spacing: 0.04em; }
    @media (max-width: 900px) { .adv-grid { columns: 2; } }
    @media (max-width: 540px) { .adv-grid { columns: 2; column-gap: 0.5rem; } .adv-grid a { margin-bottom: 0.5rem; } .lightbox__btn { width: 40px; height: 40px; } }
  </style>
</head>
<body>
  <nav class="fr-nav" id="navbar">
    <a href="index.html" class="fr-nav__logo">Frank<span>.</span></a>
    <ul class="fr-nav__links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="codclimb.html">CodClimb</a></li>
      <li><a href="adventures.html">Adventures</a></li>
      <li><a href="photography.html" class="active">Photography</a></li>
      <li><a href="videography.html">Videography</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="nav-cta">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </nav>

  <header class="gal-hero container">
    <div class="gal-hero__eyebrow fade-up">Photography · Live Music</div>
    <h1 class="fade-up-2">Concerts — Indie</h1>
    <p class="gal-hero__sub fade-up-3">Alternative and indie sets up close.</p>
    <div class="gal-hero__meta fade-up-4">
      <span class="gal-count">1 photos</span>
      <a class="gal-back" href="photography.html">&#8592; All photography</a>
    </div>
  </header>

  <hr class="divider" style="margin-top:2rem;" />

  <section class="gal-section container">
    <div class="adv-grid" id="grid"></div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
    <img id="lightboxImg" src="" alt="" />
    <button class="lightbox__btn lightbox__prev" id="lbPrev" aria-label="Previous">&#8592;</button>
    <button class="lightbox__btn lightbox__next" id="lbNext" aria-label="Next">&#8594;</button>
    <button class="lightbox__btn lightbox__close" id="lbClose" aria-label="Close">&#10005;</button>
    <div class="lightbox__cap" id="lbCap"></div>
  </div>

  <footer class="fr-footer container" style="margin-top:3rem;">
    <div class="fr-footer__inner">
      <div>
        <div style="font-weight:700;font-size:1rem;margin-bottom:0.25rem;">Frank Li</div>
        <div class="fr-footer__copy">&copy; <script>document.write(new Date().getFullYear())</script> Runcheng (Frank) Li &mdash; Boston, MA</div>
      </div>
      <div class="fr-footer__social">
        <a href="https://www.linkedin.com/in/runcheng-li-1b9748205/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/fr_studio_art/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.youtube.com/channel/UCC_5cwOxCAa6hTn51Bj8JXg" target="_blank" rel="noopener">YouTube</a>
        <a href="https://space.bilibili.com/398891472" target="_blank" rel="noopener">BiliBili</a>
      </div>
    </div>
  </footer>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 40));
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));

    const PHOTOS = [{"t": "images/fulls/alternative_indie/09_08_2023_CAS_1.jpeg", "f": "images/fulls/alternative_indie/09_08_2023_CAS_1.jpeg", "c": "cigarettes after sex, MGM Music Hall| 2023", "s": "Iphone 14 Pro"}];
    const grid = document.getElementById('grid');
    PHOTOS.forEach((p, idx) => {
      const a = document.createElement('a');
      a.href = p.f;
      a.addEventListener('click', (e) => { e.preventDefault(); openLightbox(idx); });
      const img = document.createElement('img');
      img.src = p.t || p.f; img.alt = p.c || 'Photo'; img.loading = 'lazy'; img.decoding = 'async';
      a.appendChild(img); grid.appendChild(a);
    });

    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbCap = document.getElementById('lbCap');
    let i = 0;
    function openLightbox(n){ i = n; render(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
    function closeLightbox(){ lb.classList.remove('open'); document.body.style.overflow=''; }
    function step(d){ i = (i + d + PHOTOS.length) % PHOTOS.length; render(); }
    function render(){
      const p = PHOTOS[i];
      lbImg.src = p.f; lbImg.alt = p.c || '';
      lbCap.innerHTML = (p.c ? p.c : '') + (p.s ? '<small>' + p.s + '</small>' : '') +
        '<small>' + (i+1) + ' / ' + PHOTOS.length + '</small>';
      [1,-1].forEach(d => { const n = new Image(); n.src = PHOTOS[(i+d+PHOTOS.length)%PHOTOS.length].f; });
    }
    document.getElementById('lbPrev').addEventListener('click', () => step(-1));
    document.getElementById('lbNext').addEventListener('click', () => step(1));
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
    let tx = null;
    lb.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, {passive:true});
    lb.addEventListener('touchend', (e) => { if (tx===null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx)>50) step(dx>0?-1:1); tx=null; }, {passive:true});
  </script>
</body>
</html>
