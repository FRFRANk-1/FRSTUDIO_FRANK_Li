<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harvard Ivy Lunar Gala — Frank Li</title>
  <meta name="description" content="Harvard Ivy Lunar Gala — videography by Runcheng (Frank) Li. Lunar New Year gala coverage, 2022–23." />
  <link rel="icon" href="images/favicons/camera.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/frank-redesign.css" />
  <style>
    .vd-hero { padding-top: 9rem; padding-bottom: 1rem; }
    .vd-hero__eyebrow { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1.1rem; display: flex; align-items: center; gap: 0.75rem; }
    .vd-hero__eyebrow::before { content: ''; display: block; width: 2rem; height: 1px; background: var(--accent); }
    .vd-hero h1 { font-size: clamp(2.6rem, 6.5vw, 4.8rem); letter-spacing: -0.03em; line-height: 1.03; margin-bottom: 1.1rem; }
    .vd-hero__sub { max-width: 620px; color: var(--text-muted); font-size: 1.04rem; margin-bottom: 1.75rem; }
    .vd-back { font-size: 0.85rem; color: var(--text-muted); }
    .vd-back:hover { color: var(--accent); }
    .vd-section { padding: 2.5rem 0 1rem; }
    .vd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .vd-embed { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden;
      background: var(--surface-2); border: 1px solid var(--border); }
    .vd-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .vd-empty { border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center; background: var(--surface); }
    .vd-empty__icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .vd-empty p { max-width: 520px; margin: 0 auto 1.5rem; }
    .vd-empty__socials { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    @media (max-width: 760px) { .vd-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="fr-nav" id="navbar">
    <a href="index.html" class="fr-nav__logo">Frank<span>.</span></a>
    <ul class="fr-nav__links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="codclimb.html">CodClimb</a></li>
      <li><a href="adventures.html">Adventures</a></li>
      <li><a href="photography.html">Photography</a></li>
      <li><a href="videography.html" class="active">Videography</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="nav-cta">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </nav>

  <header class="vd-hero container">
    <div class="vd-hero__eyebrow fade-up">Videography · Commercial</div>
    <h1 class="fade-up-2">Harvard Ivy Lunar Gala</h1>
    <p class="vd-hero__sub fade-up-3">Lunar New Year gala coverage, 2022–23.</p>
    <a class="vd-back fade-up-4" href="videography.html">&#8592; All videography</a>
  </header>

  <hr class="divider" style="margin-top:2rem;" />

  <section class="vd-section container">
    <div class="vd-grid">
      <div class="vd-embed"><iframe src="https://player.bilibili.com/player.html?bvid=BV1sA41167Pz&page=1&high_quality=1&danmaku=0" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen scrolling="no"></iframe></div>
    </div>
  </section>

  <footer class="fr-footer container" style="margin-top:3rem;">
    <div class="fr-footer__inner">
      <div>
        <div style="font-weight:700;font-size:1rem;margin-bottom:0.25rem;">Frank Li</div>
        <div class="fr-footer__copy">&copy; <script>document.write(new Date().getFullYear())</script> Runcheng (Frank) Li &mdash; Boston, MA</div>
      </div>
      <div class="fr-footer__social">
        <a href="https://www.linkedin.com/in/runcheng-li-1b9748205/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/fr_studio_art/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.youtube.com/channel/UCC_5cwOxCAa6hTn51Bj8JXg" target="_blank" rel="noopener">YouTube</a>
        <a href="https://space.bilibili.com/398891472" target="_blank" rel="noopener">BiliBili</a>
      </div>
    </div>
  </footer>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 40));
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
  </script>
</body>
</html>
